<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>December — Everett Narciso</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #242424;
      font-family: Arial, Helvetica, sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: .2em; }
    main { width: min(calc(100% - 3rem), 70rem); margin: 0 auto; padding: 4rem 0 8rem; }
    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: baseline;
      margin-bottom: 5rem;
    }
    h1 { grid-column: 2; margin: 0; font-size: 1rem; font-weight: 400; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5rem 3rem;
      align-items: start;
    }
    figure { margin: 0; }
    img { display: block; width: 100%; height: auto; }
    @media (max-width: 720px) {
      main { width: min(calc(100% - 2rem), 70rem); padding-top: 2rem; }
      header { grid-template-columns: 1fr auto; margin-bottom: 3rem; }
      h1 { grid-column: 2; }
      .gallery { grid-template-columns: 1fr; gap: 3rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="index.html" aria-label="Back to Everett Narciso home">Everett Narciso</a>
      <h1>December</h1>
    </header>
    <div class="gallery">
      <!-- To add an image: copy one figure line, change the filename and alt text.
           To remove an image: remove its entire figure line. -->
      <figure><img src="images/02.jpg" width="1488" height="2048" alt="December, work 1"></figure>
      <figure><img src="images/05.jpg" width="1489" height="2048" alt="December, work 2"></figure>
      <figure><img src="images/06.jpg" width="1489" height="2048" alt="December, work 3" loading="lazy"></figure>
      <figure><img src="images/09.jpg" width="1489" height="2048" alt="December, work 4" loading="lazy"></figure>
      <figure><img src="images/13.jpg" width="1489" height="2048" alt="December, work 5" loading="lazy"></figure>
      <figure><img src="images/14.jpg" width="1489" height="2048" alt="December, work 6" loading="lazy"></figure>
      <figure><img src="images/21.jpg" width="1489" height="2048" alt="December, work 7" loading="lazy"></figure>
      <figure><img src="images/23.jpg" width="1489" height="2048" alt="December, work 8" loading="lazy"></figure>
      <figure><img src="images/24.jpg" width="1489" height="2048" alt="December, work 9" loading="lazy"></figure>
      <figure><img src="images/25.jpg" width="1489" height="2048" alt="December, work 10" loading="lazy"></figure>
      <figure><img src="images/26.jpg" width="1489" height="2048" alt="December, work 11" loading="lazy"></figure>
    </div>
  </main>
</body>
</html>
